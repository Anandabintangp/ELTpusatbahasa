<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="description" content="Layanan informasi otomatis ELT dan TKBI Pusat Bahasa FIB Unpad.">
<title>Hubungi Admin — Pusat Bahasa FIB Unpad</title>
<link rel="icon" type="image/png" sizes="512x512" href="/assets/pusat-bahasa-icon.png">
<link rel="apple-touch-icon" href="/assets/pusat-bahasa-icon.png">
<link rel="preload" href="/assets/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/hubungi-admin/styles.css">
<script src="/hubungi-admin/app.js" defer></script>
</head>
<body>
<div class="pbwa2-page" id="pbwa2Page">
  <div class="pbwa2-shell">
    <aside class="pbwa2-sidebar" aria-label="Daftar chat">
      <div class="pbwa2-side-head pbwa2-side-head-search">
        <div class="pbwa2-searchbox pbwa2-searchbox-top">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 3a6.5 6.5 0 015.17 10.44l4.45 4.45-1.41 1.41-4.45-4.45A6.5 6.5 0 119.5 3zm0 2a4.5 4.5 0 100 9 4.5 4.5 0 000-9z"/></svg>
          <input id="pbwa2Search" aria-label="Cari topik bantuan" type="text" placeholder="Cari topik bantuan" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search">
        </div>
        <div class="pbwa2-side-icons">
        </div>
      </div>
      <div class="pbwa2-chatlist" id="pbwa2ChatList"></div>
    </aside>

    <main class="pbwa2-main" aria-label="Chatbot admin">
      <header class="pbwa2-topbar">
        <div class="pbwa2-contact">
          <button class="pbwa2-back" type="button" id="pbwa2Back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
          <div class="pbwa2-logo" id="pbwa2ProfileLogo"><img src="/assets/pusat-bahasa-icon.png" alt="Pusat Bahasa"></div>
          <button type="button" class="pbwa2-contact-open" id="pbwa2ProfileName" aria-controls="pbwa2Profile" aria-expanded="false" aria-label="Buka info kontak">
            <span class="pbwa2-contact-name">Admin Pusat Bahasa</span>
            <span class="pbwa2-contact-status" id="pbwa2Status" role="status">menghubungkan...</span>
          </button>
        </div>
        <div class="pbwa2-top-icons">
          <button class="pbwa2-iconbtn" type="button" id="pbwa2ResetTop" title="Mulai ulang" aria-label="Mulai ulang"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6a6 6 0 01-10.24 4.24l-1.42 1.42A8 8 0 1012 5z"/></svg></button>
          <button class="pbwa2-iconbtn pbwa2-close-desktop" type="button" id="pbwa2Close" title="Kembali ke halaman ELT" aria-label="Kembali ke halaman ELT"><svg viewBox="0 0 24 24"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.41L10.59 13.41 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"/></svg></button>
        </div>
      </header>

      <section class="pbwa2-body" id="pbwa2Body" role="log" aria-live="polite" aria-relevant="additions" aria-label="Percakapan layanan informasi"></section>

      <footer class="pbwa2-inputbar">
        <div class="pbwa2-compose"><input id="pbwa2Input" aria-label="Pesan untuk layanan informasi" type="text" placeholder="Ketik pesan" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" inputmode="text"></div>
        <button class="pbwa2-send" id="pbwa2Send" type="button" aria-label="Kirim"><svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </footer>

      <aside class="pbwa2-profile" id="pbwa2Profile" aria-label="Info kontak" aria-hidden="true" inert>
        <div class="pbwa2-profile-head">
          <button class="pbwa2-iconbtn" id="pbwa2ProfileClose" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
          <span>Info kontak</span>
        </div>
        <div class="pbwa2-profile-body">
          <div class="pbwa2-profile-card">
            <div class="pbwa2-profile-avatar"><img src="/assets/pusat-bahasa-icon.png" alt="Pusat Bahasa"></div>
            <h2 class="pbwa2-profile-name">Pusat Bahasa FIB Unpad</h2>
            <div class="pbwa2-profile-sub">Layanan informasi otomatis</div>
          </div>
          <div class="pbwa2-profile-card left">
            <div class="pbwa2-profile-title">Info Pusat Bahasa</div>
            <div class="pbwa2-profile-text">Pusat Pelayanan Bahasa Fakultas Ilmu Budaya Universitas Padjadjaran. Melayani informasi mengenai pendaftaran dan pelaksanaan tes ELT serta TKBI secara daring dan luring.</div>
          </div>
          <div class="pbwa2-profile-card left">
            <a class="pbwa2-profile-link" href="https://pusatbahasa.fib.unpad.ac.id" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.93 6h-3.1a15.7 15.7 0 00-1.2-3.05A8.04 8.04 0 0118.93 8zM12 4.04A14.1 14.1 0 0113.74 8h-3.48A14.1 14.1 0 0112 4.04zM4.26 14a8.5 8.5 0 010-4h3.5a17.1 17.1 0 000 4h-3.5zm.81 2h3.1a15.7 15.7 0 001.2 3.05A8.04 8.04 0 015.07 16zm3.1-8h-3.1a8.04 8.04 0 014.3-3.05A15.7 15.7 0 008.17 8zM12 19.96A14.1 14.1 0 0110.26 16h3.48A14.1 14.1 0 0112 19.96zM14.17 14H9.83a14.8 14.8 0 010-4h4.34a14.8 14.8 0 010 4zm.46 5.05A15.7 15.7 0 0015.83 16h3.1a8.04 8.04 0 01-4.3 3.05zM16.24 14a17.1 17.1 0 000-4h3.5a8.5 8.5 0 010 4h-3.5z"/></svg>
              pusatbahasa.fib.unpad.ac.id
            </a>
            <a class="pbwa2-profile-link" href="https://www.instagram.com/unpadpusatbahasa" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 01-5.8 5.8H7.8A5.8 5.8 0 012 16.2V7.8A5.8 5.8 0 017.8 2zm-.2 2A3.6 3.6 0 004 7.6v8.8A3.6 3.6 0 007.6 20h8.8a3.6 3.6 0 003.6-3.6V7.6A3.6 3.6 0 0016.4 4H7.6zm9.65 1.5A1.25 1.25 0 1116 6.75a1.25 1.25 0 011.25-1.25zM12 7a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6z"/></svg>
              @unpadpusatbahasa
            </a>
          </div>
        </div>
      </aside>
    </main>
  </div>
</div>

<noscript><p style="position:fixed;inset:0;background:#fff;color:#111;padding:24px;z-index:2147483647">Aktifkan JavaScript untuk memakai layanan chat. <a href="/">Kembali ke halaman ELT</a> atau hubungi <a href="https://www.instagram.com/unpadpusatbahasa">Instagram Pusat Bahasa</a>.</p></noscript>
</body>
</html>
